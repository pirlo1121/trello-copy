<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de tareas</title>
  <!-- Aplica el tema antes de pintar para evitar parpadeo -->
  <script>
    (function () {
      var saved = localStorage.getItem('tablero-tema');
      var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>Tablero de tareas</h1>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>

    <form id="task-form" autocomplete="off">
      <input id="title" name="title" type="text" placeholder="Título *" required maxlength="80">
      <input id="description" name="description" type="text" placeholder="Descripción (opcional)" maxlength="200">

      <div class="datepicker">
        <input type="hidden" id="date" name="date">
        <button type="button" id="date-trigger" class="date-trigger" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span id="date-label" class="placeholder">Fecha (opcional)</span>
        </button>

        <div id="calendar" class="calendar" role="dialog" aria-label="Elegir fecha" hidden>
          <div class="cal-header">
            <button type="button" class="cal-nav" data-nav="-1" aria-label="Mes anterior">‹</button>
            <span id="cal-title" class="cal-title"></span>
            <button type="button" class="cal-nav" data-nav="1" aria-label="Mes siguiente">›</button>
          </div>
          <div class="cal-weekdays">
            <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
          <div class="cal-footer">
            <button type="button" id="cal-clear" class="cal-link">Borrar</button>
            <button type="button" id="cal-today" class="cal-link">Hoy</button>
          </div>
        </div>
      </div>

      <button type="submit" class="primary">Agregar</button>
    </form>
  </header>

  <main class="board">
    <section class="column" data-status="pendiente">
      <h2><span class="dot"></span>Pendientes <span class="count"></span></h2>
      <ul class="task-list"></ul>
    </section>
    <section class="column" data-status="en-proceso">
      <h2><span class="dot"></span>En proceso <span class="count"></span></h2>
      <ul class="task-list"></ul>
    </section>
    <section class="column" data-status="terminada">
      <h2><span class="dot"></span>Terminadas <span class="count"></span></h2>
      <ul class="task-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
